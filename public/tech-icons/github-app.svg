<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    
    <linearGradient id="github-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181C24"/>
      <stop offset="100%" stop-color="#0A0D12"/>
    </linearGradient>
    <radialGradient id="github-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="github-shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="github-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Full Bleed Squircle App Canvas (ZERO PADDING) -->
  <rect width="512" height="512" rx="114" fill="url(#github-bg)"/>
  <rect width="512" height="512" rx="114" fill="url(#github-glow)"/>
  <rect width="512" height="512" rx="114" fill="url(#github-shine)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="113" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2.5"/>

